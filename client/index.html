<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Forma</title>
    <meta name="description" content="Forma is a focused training log for tracking sessions, sets, and progress." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Forma" />
    <meta property="og:description" content="A focused training log for tracking sessions, sets, and progress." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/forma-mark.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Forma" />
    <meta name="twitter:image" content="/forma-mark.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('forma.theme');
          var isDark = stored === 'dark' || (stored === null && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (error) {
          // localStorage may be unavailable (private browsing); fall back to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
